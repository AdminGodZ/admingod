<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Broadside">
<title>Broadside</title>
<defs>
  <radialGradient id="bgm" cx="50%" cy="38%" r="75%">
    <stop offset="0" stop-color="#123349"/><stop offset="1" stop-color="#08131c"/>
  </radialGradient>
  <linearGradient id="hullm" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4f9fc"/><stop offset="1" stop-color="#b9cbd7"/>
  </linearGradient>
  <radialGradient id="hitm" cx="50%" cy="45%" r="60%">
    <stop offset="0" stop-color="#ffb199"/><stop offset=".45" stop-color="#f0503c"/><stop offset="1" stop-color="#9e2416"/>
  </radialGradient>
  <filter id="glowm" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="sweepm" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f5c02a" stop-opacity="0"/><stop offset="1" stop-color="#f5c02a" stop-opacity=".16"/>
  </linearGradient>
</defs>
<style>
  .ringm { transform-box: fill-box; transform-origin: center; animation: pingm 2.4s ease-out infinite; }
  @keyframes pingm { 0% { transform: scale(.6); opacity: .95; } 80%,100% { transform: scale(2.1); opacity: 0; } }
  .scanm { animation: scanm 7s linear infinite; }
  @keyframes scanm { from { transform: translateX(0); } to { transform: translateX(var(--travel)); } }
  @media (prefers-reduced-motion: reduce) { .ringm, .scanm { animation: none; } }
</style>
