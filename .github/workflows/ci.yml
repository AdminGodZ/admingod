name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  biome:
    name: Biome (lint, format, imports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx biome ci --reporter=github

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and build (tsc --noEmit && astro build)
        run: npm run build
      - name: Check build output
        run: |
          for file in index.html contact/index.html 404.html sitemap.xml robots.txt; do
            test -s "dist/$file" || { echo "::error::dist/$file is missing"; exit 1; }
          done
      - name: Check the lockfile is in sync
        run: git diff --exit-code -- package-lock.json

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report all advisories
        run: npm audit || true

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: admingod:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: docker run -d --name site -e PORT=8080 -p 8080:8080 admingod:ci
      - name: Smoke test
        run: scripts/smoke-test.sh http://localhost:8080
      - name: Container logs
        if: always()
        run: docker logs site

  deploy:
    name: Deploy to Railway
    needs: [biome, build, audit, container]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:5.71.0
    timeout-minutes: 20
    environment:
      name: production
      url: https://admingod.ch
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Check Railway credentials
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "${{ vars.RAILWAY_SERVICE }}" ]; then
            echo "::error::Set the RAILWAY_TOKEN secret and RAILWAY_SERVICE variable on the production environment"
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Deploy
        run: railway up --ci --service "${{ vars.RAILWAY_SERVICE }}" --environment production
